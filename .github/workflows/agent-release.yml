name: Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Agent version
        required: true
        type: string
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: kubi-agent-linux-amd64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: kubi-agent-linux-arm64
          - runner: macos-14
            target: bun-darwin-x64
            artifact: kubi-agent-darwin-amd64
          - runner: macos-14
            target: bun-darwin-arm64
            artifact: kubi-agent-darwin-arm64
          - runner: windows-latest
            target: bun-windows-x64
            artifact: kubi-agent-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build native agent
        shell: bash
        env:
          KUBI_AGENT_VERSION: ${{ inputs.version || github.ref_name }}
          KUBI_AGENT_BUILD_ID: ${{ github.sha }}
        run: |
          VERSION="${KUBI_AGENT_VERSION#agent-v}"
          bun build agent/src/cli.js agent/src/timeline/store-worker.js --compile --target=${{ matrix.target }} \
            --define KUBI_AGENT_COMPILED_VERSION="\"${VERSION}\"" \
            --define KUBI_AGENT_COMPILED_BUILD_ID="\"${KUBI_AGENT_BUILD_ID}\"" \
            --outfile=dist/${{ matrix.artifact }}
      - name: Write checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          else
            shasum -a 256 dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          fi
      - name: Verify embedded release version
        if: matrix.target == 'bun-linux-x64'
        shell: bash
        env:
          KUBI_AGENT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${KUBI_AGENT_VERSION#agent-v}"
          chmod +x dist/${{ matrix.artifact }}
          OUTPUT="$(env -u KUBI_AGENT_VERSION -u KUBI_AGENT_BUILD_ID dist/${{ matrix.artifact }} version)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -F "kubi-agent ${VERSION} ("
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/agent-v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Add installer scripts and checksum manifest
        run: |
          cp agent/install/install.sh dist/install.sh
          cp agent/install/install.ps1 dist/install.ps1
          cp observability/grafana/kubi-agent-overview.json dist/kubi-agent-grafana-dashboard.json
          cp observability/prometheus/kubi-agent-alerts.yaml dist/kubi-agent-alerts.yaml
          cp observability/prometheus/scrape-local.example.yaml dist/kubi-agent-scrape-local.yaml
          cp observability/prometheus/scrape-remote.example.yaml dist/kubi-agent-scrape-remote.yaml
          chmod +x dist/install.sh
          (cd dist && sha256sum kubi-agent-* install.sh install.ps1 > SHA256SUMS)
      - name: Sign release artifacts
        run: |
          for file in dist/kubi-agent-* dist/install.sh dist/install.ps1 dist/SHA256SUMS; do
            cosign sign-blob --yes "$file" --output-signature "$file.sig" --output-certificate "$file.pem"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('agent-v{0}', inputs.version) }}
          name: kubi-agent ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          generate_release_notes: true
          files: dist/*
